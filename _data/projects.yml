- title: KHKade
  date: Spring, 2026
  image:
    src: ""
    alt: ""
  description: >-
    A Clash Royale-inspired 2D game in a '90s-style arcade cabinet, featuring
    KHK members as characters and UW–Madison campus buildings as towers.
    Our team earned 2nd place at the University of Wisconsin–Madison College
    of Engineering's 2026 Engineering EXPO.
  bullets:
    - Worked alongside 10 other members to bring the arcade machine to life.
    - Led Ubuntu Linux installation on the NVIDIA Jetson Orin Nano development board and set up a development-to-production pipeline between the game developers' computers and the arcade machine.
    - Helped configure and troubleshoot hardware, including soldering connections for the cabinet's buttons and joysticks.
  links:
    - text: Learn More!
      url: https://delta.khk.org/posts/2026-04-28-expo-team-2nd-place/

