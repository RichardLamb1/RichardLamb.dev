<div class="col-xl-4 col-md-6">
    <div class="card my-4 text-bg-dark blog-link border-0" title="{{ post.title }}">
        <!-- Cover Image -->
        {% if post.image %}
        <img src="{{ post.image.src }}" alt="{{ post.image.alt }}" class="card-img" height="300px"
            style="object-fit: cover; filter: brightness(80%)" />
        {% else %}
        <!-- Show a placeholder if there is no cover image available -->
        <svg height="300px" class="card-img" role="img" xmlns="http://www.w3.org/2000/svg">
            <rect width="100%" height="100%" fill="#222222"></rect>
        </svg>
        {% endif %}
        <div class="card-img-overlay d-flex flex-column text-shadow-1">
            <!-- Date -->
            <span title="{{ post.date }}" class="small fw-bold">{{ post.date | date: "%B %_d, %Y"}}</span>
            <!-- Title -->
            <h5 class="card-title my-2 fw-semibold" style="overflow: hidden; color: #FFF;" title="{{ post.title }}"><a
                    href="{{ post.url }}" class="stretched-link" style="color: #FFF;">{{ post.title | truncate: 50 }}</a></h5>
            <!-- Description -->
            <span>{{ post.description | truncate: 100 }}</span>
            <!-- Author -->
            <span class="mt-auto"><i class="bi bi-person-fill"></i> {% if post.author %}{{ post.author }}{% else %}Richard Lamb{% endif %}</span>
        </div>
    </div>
</div>
