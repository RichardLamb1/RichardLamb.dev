<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Icon -->
<link rel="icon" href="/favicon.ico" type="image/x-icon" />
<link rel="icon" href="/icon256x256.png" />
<link rel="icon" href="/icon128x128.png" />
<link rel="icon" href="/icon64x64.png" />
<link rel="icon" href="/icon48x48.png" />
<link rel="icon" href="/icon32x32.png" />
<link rel="icon" href="/icon16x16.png" />
<link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
<link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />

<!-- Legacy cover images use image.src; SEO Tag handles image.path. -->
{% if page.image.src and page.image.path == nil %}
<meta property="og:image" content="{{ page.image.src | absolute_url | escape }}" />
<meta property="og:image:alt" content="{{ page.image.alt | escape }}" />
<meta name="twitter:image" content="{{ page.image.src | absolute_url | escape }}" />
<meta name="twitter:image:alt" content="{{ page.image.alt | escape }}" />
{% endif %}

<!-- Feed -->
{% feed_meta %}

<!-- Style -->
<link href="/lib/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="/lib/bootstrap-icons-1.13.1/bootstrap-icons.min.css" rel="stylesheet" />
<link href="/assets/css/main.css" rel="stylesheet" />
