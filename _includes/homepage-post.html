<div class="col-lg-3 col-md-4">
    <div class="card my-4 text-bg-dark blog-link" title="{{ post.title }}">
        <!-- Cover Image -->
        {% if post.image %}
        <img src="{{ post.image.src }}" alt="{{ post.image.alt }}" class="card-img" height="250px"
            style="object-fit: cover; filter: brightness(40%)" />
        {% else %}
        <!-- Show a placeholder if there is no cover image available -->
        <!--
        <svg height="200px" class="card-img-top" role="img" xmlns="http://www.w3.org/2000/svg">
            <rect width="100%" height="100%" fill="#55595c"></rect>
        </svg>
        -->
        {% endif %}
        <div class="card-img-overlay">
            <!-- Date -->
            <span title="{{ post.date }}" class="small" style="font-weight: 600;">{{ post.date | date: "%B %_d, %Y"}}</span>
            <!-- Title -->
            <h5 class="card-title my-2" style="overflow: hidden; font-weight: 600; color: #FFF;" title="{{ post.title }}"><a
                    href="{{ post.url }}" class="stretched-link" style="color: #FFF;">{{ post.title | truncate: 50 }}</a></h5>
            <!-- Description -->
            <span>{{ post.description | truncate: 100 }}</span>
        </div>
    </div>
</div>
