services:
  jekyll:
    image: jekyll/jekyll:latest
    command: bundle exec jekyll serve --livereload --force_polling --drafts --host 0.0.0.0
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - jekyll_gems:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development

volumes:
  jekyll_gems:
